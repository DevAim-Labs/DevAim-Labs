# Security headers for files nginx serves itself (copy to /etc/nginx/snippets/).
# PHP responses get the same headers, plus the nonce CSP, from
# App\Http\Middleware\SecurityHeaders, so this snippet is NOT included for PHP.
#
# nginx rule: a location with any add_header drops every add_header from the
# server level, so each static location includes this snippet itself.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), browsing-topics=(), interest-cohort=()" always;
