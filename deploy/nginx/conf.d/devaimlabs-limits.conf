# http {} context: copy to /etc/nginx/conf.d/devaimlabs-limits.conf
# (Ubuntu's nginx.conf includes conf.d/*.conf inside http {}).
#
# Rate limiting before PHP. Complements Laravel's own limiters
# (App\Providers\AppServiceProvider): nginx rejects floods cheaply, Laravel
# does the precise per-email / per-form limits.

# All PHP requests: 10/s per IP on average, bursts of 40 (a page view is 1 PHP
# request; assets are served by nginx and not limited).
limit_req_zone $binary_remote_addr zone=devaim_php:10m rate=10r/s;

# Contact form POSTs only: 6/min per IP. GET /contact gets an empty key and is
# therefore not counted in this zone.
map $request_method $devaim_contact_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $devaim_contact_post zone=devaim_contact:10m rate=6r/m;

# Max simultaneous connections per IP.
limit_conn_zone $binary_remote_addr zone=devaim_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# Don't advertise the nginx version (commented out in Ubuntu's nginx.conf).
server_tokens off;

# Compress text responses (nginx.conf already has "gzip on"; types are not set there).
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
