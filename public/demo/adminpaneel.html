@font-face{font-family:'Geist';font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/adminpaneel/geist-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Geist';font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/adminpaneel/geist-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Geist Mono';font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/adminpaneel/geist-mono-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#F5F6F8;--panel:#FFFFFF;--sunken:#EFF1F4;--hover:#F2F4F7;--line:#E2E5EA;--line-2:#D2D7DE;
  --ink:#0F1419;--ink-2:#353E4A;--muted:#5A6471;--faint:#98A1AD;
  --accent:#2A56E0;--accent-2:#1F47C8;--accent-soft:#EBF0FE;--accent-line:#C7D4FB;--on-accent:#FFFFFF;
  --sel:#F1F5FF;--active:#E6EDFE;
  --st-new-fg:#1E4FBF;--st-new-bg:#EAF0FD;
  --st-plan-fg:#5B35C7;--st-plan-bg:#F1ECFD;
  --st-go-fg:#0B6A7E;--st-go-bg:#E3F4F7;
  --st-wait-fg:#9A4A06;--st-wait-bg:#FDF1E1;
  --st-done-fg:#16703A;--st-done-bg:#E6F4EA;
  --st-off-fg:#5A6471;--st-off-bg:#EDEFF2;
  --danger:#C22A3C;--danger-soft:#FCEBED;
  --shadow-1:0 1px 2px rgba(15,20,25,.05);
  --shadow-pop:0 0 0 1px rgba(15,20,25,.06),0 4px 10px -2px rgba(15,20,25,.08),0 16px 36px -8px rgba(15,20,25,.18);
  --scrim:rgba(15,20,25,.22);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --sbw:204px;--r:8px;--r-sm:6px;--hit:32px;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0C0E12;--panel:#13161B;--sunken:#191D23;--hover:#1B1F26;--line:#252A32;--line-2:#323843;
  --ink:#ECEFF3;--ink-2:#C5CBD3;--muted:#98A1AD;--faint:#5E6773;
  --accent:#7094FF;--accent-2:#8FABFF;--accent-soft:rgba(112,148,255,.14);--accent-line:rgba(112,148,255,.38);--on-accent:#0C0E12;
  --sel:rgba(112,148,255,.08);--active:rgba(112,148,255,.14);
  --st-new-fg:#8FB0FF;--st-new-bg:rgba(112,148,255,.14);
  --st-plan-fg:#B9A2FF;--st-plan-bg:rgba(160,128,255,.15);
  --st-go-fg:#5FCFE0;--st-go-bg:rgba(60,190,210,.13);
  --st-wait-fg:#F2B25C;--st-wait-bg:rgba(240,160,60,.14);
  --st-done-fg:#6FD495;--st-done-bg:rgba(80,200,120,.13);
  --st-off-fg:#98A1AD;--st-off-bg:rgba(150,160,175,.12);
  --danger:#FF7A88;--danger-soft:rgba(255,100,115,.13);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.07),0 16px 40px -8px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (pointer:coarse){:root{--hit:44px}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
kbd{font:500 11.5px/1 var(--mono);min-width:20px;height:20px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;color:var(--ink-2);background:var(--panel)}

/* demo banner */
.demo-banner{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:5px 16px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;text-align:center}
.demo-banner__tag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--mono);letter-spacing:.02em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:rgba(255,255,255,.12)}
[data-theme=dark] .demo-banner__tag{background:rgba(0,0,0,.08)}
.demo-banner__tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#F2B25C}
.demo-banner a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.is-embed .demo-banner__links{display:none}

/* shell */
.app{flex:1;min-height:0;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr)}
.app.collapsed{--sbw:60px}
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 10px 10px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 4px 12px;min-height:44px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;font:700 13px/1 var(--font);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.brand b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.brand .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.ibtn{width:var(--hit);height:var(--hit);display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);flex:none;transition:background-color .12s,color .12s,transform .12s var(--ease-out)}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn:active{transform:scale(.94)}
.nav-sec{margin:14px 0 4px;padding:0 8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:10px;height:max(32px,var(--hit));padding:0 8px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;position:relative;transition:background-color .12s,color .12s}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current=page]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.nav a[aria-current=page] svg{color:var(--accent)}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a .lk{margin-left:auto;color:var(--faint)}
.nav a .lbl{overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:9px;width:100%;padding:6px;border-radius:var(--r);text-align:left}
.me:hover{background:var(--hover)}
.me .grow{min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.me b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;font-size:12px;color:var(--muted)}
@media (min-width:761px){
.collapsed .brand .grow,.collapsed .nav-sec,.collapsed .nav .lbl,.collapsed .nav .cnt,.collapsed .nav .lk,.collapsed .me .grow,.collapsed .me>svg{display:none}
.collapsed .nav-sec{display:block;height:1px;background:var(--line);margin:12px 6px;font-size:0}
.collapsed .brand{flex-direction:column;gap:8px}
.collapsed .nav a{justify-content:center;padding:0}
}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:600 10.5px/1 var(--font);color:#fff;letter-spacing:.02em}
.av.lg{width:30px;height:30px;font-size:12px}
.av.none{background:transparent!important;border:1.5px dashed var(--line-2);color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.top{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px 0 18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap;min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--faint)}
.top .spacer{flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;height:max(32px,var(--hit));width:min(280px,34vw);padding:0 6px 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--muted);transition:border-color .12s,background-color .12s}
.searchbtn:hover{border-color:var(--line-2);background:var(--panel)}
.searchbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.imp{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 18px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);color:var(--ink-2);font-size:12.5px}
.imp svg{color:var(--accent)}
.imp b{color:var(--ink)}
.imp button{margin-left:auto;font-weight:600;color:var(--accent-2);padding:4px 6px;border-radius:5px}
.imp button:hover{background:var(--panel)}

.content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;position:relative}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 10px}
.phead h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.phead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.phead .acts{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:max(32px,var(--hit));padding:0 12px;border-radius:var(--r);font-weight:550;font-size:13px;white-space:nowrap;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1);transition:background-color .12s,border-color .12s,transform .12s var(--ease-out)}
.btn:hover{background:var(--hover)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(42,86,224,.3)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn kbd{height:18px;min-width:18px;font-size:11px;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit}

/* views + toolbar */
.views{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.views button{position:relative;display:flex;align-items:center;gap:7px;height:max(38px,var(--hit));padding:0 10px;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.views button:hover{color:var(--ink)}
.views button[aria-selected=true]{color:var(--ink)}
.views button[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.views .c{font-size:11.5px;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--sunken);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.views button[aria-selected=true] .c{background:var(--accent-soft);color:var(--accent-2)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;flex:none}
.field{position:relative;display:flex;align-items:center}
.field svg{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.field input{height:max(32px,var(--hit));width:220px;padding:0 28px 0 31px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);outline:none;transition:border-color .12s,box-shadow .12s}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field kbd{position:absolute;right:6px;pointer-events:none}
.field input:focus~kbd,.field input:not(:placeholder-shown)~kbd{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:max(30px,var(--hit));padding:0 10px;border:1px dashed var(--line-2);border-radius:999px;color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background-color .12s,border-color .12s}
.chip:hover{background:var(--hover)}
.chip.on{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-2)}
.chip .v{font-weight:600;color:var(--ink)}
.chip.on .v{color:var(--accent-2)}
.clear{font-size:12.5px;color:var(--muted);padding:6px 8px;border-radius:6px;font-weight:500}
.clear:hover{color:var(--ink);background:var(--hover)}
.tools .right{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}

/* table */
.tablewrap{flex:1;min-height:180px;overflow:auto;border-top:1px solid var(--line);position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}
th,td{text-align:left;padding:0 8px;height:42px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;z-index:2;height:34px;background:var(--bg);font-size:12px;font-weight:550;color:var(--muted)}
th:first-child,td:first-child{padding-left:16px;width:44px}
th:last-child,td:last-child{padding-right:18px}
.sortb{display:inline-flex;align-items:center;gap:4px;height:28px;margin:0 -6px;padding:0 6px;border-radius:5px;color:inherit;font-weight:inherit}
.sortb:hover{background:var(--hover);color:var(--ink)}
.sortb svg{width:13px;height:13px;opacity:0;transition:opacity .12s}
.sortb:hover svg,th[aria-sort] .sortb svg{opacity:1}
th[aria-sort] .sortb{color:var(--ink)}
th[aria-sort=ascending] .sortb svg{transform:scaleY(-1)}
.r{text-align:right}th.r .sortb{flex-direction:row-reverse}
tbody tr{cursor:default;transition:background-color .1s}
tbody tr:hover{background:var(--hover)}
tbody tr.is-sel{background:var(--sel)}
tbody tr.is-act{background:var(--active);box-shadow:inset 2px 0 0 var(--accent)}
tbody tr:focus{outline:none}
tbody tr:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
tbody tr.flash{animation:flash 1.2s var(--ease-out)}
@keyframes flash{from{background:var(--accent-soft)}}
.cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1.5px solid var(--line-2);border-radius:4px;background:var(--panel);display:grid;place-items:center;cursor:pointer;vertical-align:middle;transition:background-color .1s,border-color .1s;position:relative}
.cb::after{content:"";width:8px;height:4.5px;border:solid var(--on-accent);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg) scale(.6);opacity:0;transition:transform .14s var(--ease-out),opacity .1s}
.cb:checked,.cb:indeterminate{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{opacity:1;transform:translateY(-1px) rotate(-45deg) scale(1)}
.cb:indeterminate::after{width:8px;height:0;border-width:0 0 2px;transform:none;opacity:1}
.cbhit{display:inline-grid;place-items:center;width:var(--hit);height:var(--hit);margin:-6px;cursor:pointer}
.wk{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.wk b{font-weight:560;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:215px}
.wk span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:215px}
.who{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.who.un{color:var(--muted)}
.when{color:var(--ink-2)}
.when.today{color:var(--ink);font-weight:550}
.when.late{color:var(--danger)}
.prio{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px}
.bars{display:inline-flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:3px;border-radius:1px;background:var(--line-2)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}
.p1 .bars i{background:var(--danger)}.p1{color:var(--danger);font-weight:600}
.p2 .bars i:nth-child(-n+3){background:var(--ink-2)}
.p3 .bars i:nth-child(-n+2){background:var(--ink-2)}
.p4 .bars i:nth-child(1){background:var(--ink-2)}
.amt{font-variant-numeric:tabular-nums;color:var(--ink)}
.locked{display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-size:12px}
.locked svg{width:13px;height:13px}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;font-size:12.5px;font-weight:550;white-space:nowrap;color:var(--fg);background:var(--bg-s);transition:background-color .18s,color .18s,box-shadow .12s,transform .12s var(--ease-out)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 20%,transparent)}
button.pill:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 35%,transparent)}
button.pill:active{transform:scale(.96)}
button.pill svg{width:12px;height:12px;margin:0 -3px 0 -2px;opacity:.7}
td button.pill svg{width:0;margin:0;opacity:0;transition:opacity .12s}
td button.pill:hover svg,td button.pill:focus-visible svg,td button.pill[aria-expanded=true] svg{width:12px;margin:0 -3px 0 -2px;opacity:.7}
.s-nieuw{--fg:var(--st-new-fg);--bg-s:var(--st-new-bg)}
.s-gepland{--fg:var(--st-plan-fg);--bg-s:var(--st-plan-bg)}
.s-onderweg{--fg:var(--st-go-fg);--bg-s:var(--st-go-bg)}
.s-wacht{--fg:var(--st-wait-fg);--bg-s:var(--st-wait-bg)}
.s-afgerond{--fg:var(--st-done-fg);--bg-s:var(--st-done-bg)}
.s-geannuleerd{--fg:var(--st-off-fg);--bg-s:var(--st-off-bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg);flex:none}

.pager{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;background:var(--panel)}
.pager .grow{flex:1}
.pager .hint{display:flex;align-items:center;gap:6px}
.pager nav{display:flex;gap:4px;align-items:center}
.pager .ibtn{border:1px solid var(--line)}
.pager .ibtn:disabled{opacity:.4}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:48px 20px;color:var(--muted)}
.empty .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);margin-bottom:6px}
.empty .ico svg{width:20px;height:20px}
.empty h2{margin:0;font-size:14.5px;font-weight:600;color:var(--ink)}
.empty p{margin:0 0 8px;max-width:340px}

/* skeleton */
.sk{display:block;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--sunken) 0%,var(--hover) 40%,var(--sunken) 80%) 0 0/300% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}

/* bulk bar */
.bulk{position:absolute;left:50%;bottom:58px;z-index:20;width:max-content;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 12px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:0 12px 32px -8px rgba(15,20,25,.45);transform:translate(-50%,calc(100% + 72px));opacity:0;visibility:hidden;transition:transform .16s var(--ease-out),opacity .12s,visibility 0s .16s;max-width:calc(100% - 24px);flex-wrap:wrap}
.bulk.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .24s var(--ease-drawer),opacity .16s,visibility 0s}
.bulk .n{font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bulk .b{display:inline-flex;align-items:center;gap:6px;height:max(30px,var(--hit));padding:0 10px;border-radius:8px;color:inherit;font-weight:500;white-space:nowrap;transition:background-color .12s}
.bulk .b:hover{background:rgba(255,255,255,.12)}
[data-theme=dark] .bulk .b:hover{background:rgba(0,0,0,.08)}
.bulk .b.d{color:#FF9AA5}
[data-theme=dark] .bulk .b.d{color:#B0182A}
.bulk .vr{width:1px;height:18px;background:rgba(127,127,127,.4);margin:0 2px}

/* popover menu */
.menu{position:fixed;z-index:80;min-width:200px;max-width:300px;max-height:min(340px,70vh);overflow:auto;padding:5px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow-pop);transform-origin:var(--o,top left)}
.menu.anim{animation:pop .15s var(--ease-out)}
.menu.out{opacity:0;transform:scale(.97);transition:opacity .09s,transform .09s}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-3px)}}
.menu .mh{padding:6px 8px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.mi{display:flex;align-items:center;gap:9px;width:100%;min-height:max(32px,var(--hit));padding:0 8px;border-radius:6px;text-align:left;color:var(--ink);font-size:13px}
.mi[aria-selected=true],.mi.hl{background:var(--hover)}
.mi .ck{margin-left:auto;color:var(--accent);visibility:hidden}
.mi[aria-checked=true] .ck{visibility:visible}
.mi .sub{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.mi[aria-checked=true] .sub{margin-left:8px}
.mi[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.mi .mbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.mi[aria-checked=true] .mbox{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mi .mbox svg{width:11px;height:11px;stroke-width:2.6;visibility:hidden}
.mi[aria-checked=true] .mbox svg{visibility:visible}
.mi.multi .ck{display:none}

/* overlays */
.scrim{position:fixed;inset:var(--bh,0px) 0 0 0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .16s}
.scrim.show{opacity:1;transition-duration:.22s}
.over{position:fixed;z-index:50;background:var(--panel);box-shadow:var(--shadow-pop)}
.sheet{top:var(--bh,0px);right:0;bottom:0;width:min(440px,100vw);display:flex;flex-direction:column;border-left:1px solid var(--line);transform:translateX(104%);transition:transform .18s var(--ease-out)}
.sheet.show{transform:none;transition:transform .26s var(--ease-drawer)}
.sh-head{flex:none;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sh-head .mono{color:var(--muted)}
.sh-head .grow{flex:1}
.sh-body{flex:1;overflow:auto;padding:18px 20px 24px}
.sh-body h2{margin:0 0 2px;font-size:18px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.sh-body .lead{margin:0 0 14px;color:var(--muted)}
.sh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 12px;margin:0 0 20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);min-width:0}
.sec-t{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.assign{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);text-align:left;margin-bottom:20px;transition:border-color .12s,background-color .12s}
.assign:hover:not(:disabled){border-color:var(--line-2);background:var(--hover)}
.assign .grow{flex:1;min-width:0}
.assign small{display:block;color:var(--muted);font-size:12px}
.assign:disabled{opacity:.6}
.note{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.note textarea{width:100%;min-height:68px;resize:vertical;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);outline:none;line-height:1.45;transition:border-color .12s,box-shadow .12s}
.note textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note .row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.note .row .btn{margin-left:auto}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:24px 1fr;gap:10px;padding:0 0 14px}
.tl .ic{width:23px;height:23px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);position:relative}
.tl .ic svg{width:12px;height:12px}
.tl .ic.note-ic{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tl p{margin:2px 0 0;color:var(--ink-2)}
.tl p b{color:var(--ink);font-weight:560}
.tl time{display:block;font-size:12px;color:var(--muted)}
.tl .body{margin-top:5px;padding:8px 10px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);color:var(--ink);white-space:pre-wrap}
.tl li.new{animation:rise .22s var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}}
.sh-foot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.sh-foot .grow{flex:1}

.modal{top:50%;left:50%;width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;transform:translate(-50%,-50%)}
.modal.anim{animation:mpop .2s var(--ease-out)}
@keyframes mpop{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
.palette{top:max(12vh,24px);transform:translateX(-50%);width:min(600px,calc(100vw - 24px))}
.palette .pin{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.palette .pin svg{color:var(--muted)}
.palette input{flex:1;height:50px;border:0;background:none;outline:none;font-size:15px}
.palette input::placeholder{color:var(--muted)}
.plist{max-height:min(380px,56dvh);overflow:auto;padding:6px}
.pgrp{padding:8px 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.popt{display:flex;align-items:center;gap:10px;min-height:max(38px,var(--hit));padding:0 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.popt[aria-selected=true]{background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.popt svg{color:var(--muted)}
.popt .sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popt .t{white-space:nowrap}
.popt mark{background:none;color:var(--accent-2);font-weight:650}
.popt .end{margin-left:auto;display:flex;gap:4px;color:var(--muted);font-size:12px;flex:none}
.pfoot{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;background:var(--bg)}
.pfoot span{display:inline-flex;align-items:center;gap:5px}
.pnone{padding:28px 12px;text-align:center;color:var(--muted)}
.m-head{display:flex;align-items:center;gap:8px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:15px;font-weight:650;flex:1}
.m-body{padding:16px 20px;overflow:auto}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.keys h3{grid-column:1/-1;margin:10px 0 2px;font-size:12px;font-weight:600;color:var(--muted)}
.keys h3:first-child{margin-top:0}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.keys div span:last-child{display:flex;gap:3px}
.frm{display:grid;gap:12px}
.frm label{display:grid;gap:5px;font-size:12.5px;font-weight:550;color:var(--ink-2)}
.frm select,.frm input{height:max(36px,var(--hit));padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);outline:none}
.frm select:focus,.frm input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:58px;z-index:90;display:flex;flex-direction:column-reverse;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none;transition:transform .2s var(--ease-out)}
.has-bulk .toasts{transform:translateY(-54px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -8px rgba(15,20,25,.45);font-size:13px;transform:translateY(calc(100% + 16px));opacity:0;transition:transform .22s var(--ease-out),opacity .18s}
.toast.show{transform:none;opacity:1}
.toast.out{transform:translateY(8px);opacity:0;transition-duration:.14s}
.toast svg{color:#7EE2A5}
[data-theme=dark] .toast svg{color:#16703A}
.toast .msg{flex:1;min-width:0}
.toast .undo{font-weight:600;padding:6px 9px;border-radius:6px;color:inherit;background:rgba(127,127,127,.2);white-space:nowrap}
.toast .undo:hover{background:rgba(127,127,127,.32)}

/* team */
.pad{padding:0 20px 24px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .v{font-size:18px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;background:var(--panel)}
.box-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.box-h h2{margin:0;font-size:14px;font-weight:620}
.box-h p{margin:0;color:var(--muted);font-size:12.5px}
.box-h .grow{flex:1;min-width:0}
.box .tablewrap{border-top:0;flex:none;min-height:0}
.box table{min-width:720px}
.box th{background:var(--bg)}
.box tbody tr:last-child td{border-bottom:0}
.rsel{height:30px;padding:0 26px 0 8px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) calc(100% - 14px) 55%/5px 5px no-repeat,linear-gradient(135deg,var(--muted) 50%,transparent 50%) calc(100% - 9px) 55%/5px 5px no-repeat,var(--panel);appearance:none;-webkit-appearance:none;font-size:12.5px;cursor:pointer}
.rsel:disabled{opacity:.55;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.tag.ok{background:var(--st-done-bg);color:var(--st-done-fg)}
.tag.inv{background:var(--st-wait-bg);color:var(--st-wait-fg)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;width:auto;white-space:normal}
.matrix td:first-child b{display:block;font-weight:560}
.matrix td:first-child span{display:block;font-size:12px;color:var(--muted)}
.matrix td{height:52px}
.matrix th .rh{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.matrix th .rh small{font-weight:400;font-size:11.5px}
.matrix th.you{color:var(--accent-2)}
.sw{position:relative;display:inline-block;width:34px;height:20px;vertical-align:middle}
.sw input{position:absolute;inset:-12px -5px;width:calc(100% + 10px);height:calc(100% + 24px);opacity:0;margin:0;cursor:pointer;z-index:1}
.sw input:disabled{cursor:not-allowed}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background-color .16s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s var(--ease-out)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled+span{opacity:.55}
.sw:active span::after{width:19px}
.sw input:checked:active+span::after{transform:translateX(11px)}
.note-inline{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;color:var(--muted);font-size:12.5px;background:var(--bg);border-top:1px solid var(--line)}
.note-inline svg{margin-top:1px}
.denied{margin:24px 20px;border:1px dashed var(--line-2);border-radius:12px}

/* planning */
.plan{display:grid;grid-template-columns:132px repeat(5,minmax(128px,1fr));min-width:780px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:92px;min-width:0}
.plan .ph{min-height:0;background:var(--bg);font-size:12px;font-weight:550;color:var(--muted);padding:8px 10px}
.plan .ph.today{color:var(--accent-2)}
.plan .tech{display:flex;align-items:center;gap:8px;font-weight:550;background:var(--bg)}
.plan .tech small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.plan .cell.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.blk{display:block;width:100%;text-align:left;padding:6px 8px 6px 9px;margin-bottom:6px;border-radius:7px;background:var(--panel);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--fg);font-size:12.5px;line-height:1.3;transition:border-color .12s,transform .12s var(--ease-out)}
.blk:hover{border-color:var(--line-2)}
.blk:active{transform:scale(.98)}
.blk b{display:block;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk>span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log li{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.log{list-style:none;margin:0;padding:0}
.log li:last-child{border-bottom:0}
.log .grow{flex:1;min-width:0}
.log time{color:var(--muted);font-size:12px;white-space:nowrap}
.log p{margin:0}
.log small{color:var(--muted)}

@media (hover:none){tbody tr:hover{background:inherit}}
@media (max-width:760px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:60;top:var(--bh,0px);bottom:0;left:0;width:min(280px,86vw);background:var(--panel);box-shadow:var(--shadow-pop);transform:translateX(-104%);transition:transform .18s var(--ease-out);visibility:hidden}
  .side.open{transform:none;visibility:visible;transition:transform .26s var(--ease-drawer)}
  #collapseBtn{display:none}
  .menu-btn{display:inline-grid}
  .crumbs .hide-s{display:none}
  .searchbtn{width:auto}.searchbtn span,.searchbtn kbd{display:none}
  .phead{padding:14px 14px 8px}.phead .acts{margin-left:0;width:100%}
  .tools{padding:10px 12px}.field,.field input{width:100%}
  .tools .right{display:none}
  .views{padding:0 8px}
  .pager .hint{display:none}
  .pad{padding:0 12px 20px}
  .cards{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:96px 1fr}
  .keys{grid-template-columns:1fr}
  .top{padding:0 8px}
  .demo-banner{gap:4px 10px;padding:5px 12px}.demo-banner__txt{display:none}
  .bulk{position:fixed;bottom:12px;left:12px;right:12px;transform:translateY(calc(100% + 72px));justify-content:center}
  .bulk.show{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .sheet,.sheet.show,.side,.side.open,.bulk,.bulk.show,.toast,.toast.show,.toast.out{transition-property:opacity,visibility!important;transition-duration:.15s!important}
  .sheet{transform:none;opacity:0}.sheet.show{opacity:1}
  .toast{transform:none}
  .side{transform:none;opacity:0}.side.open{opacity:1}
  .bulk{transform:translate(-50%,0)}
  .sk{animation:none!important;background:var(--sunken)}
  .btn:active,.ibtn:active,button.pill:active,.blk:active{transform:none!important}
}
@media (prefers-reduced-motion:reduce) and (max-width:760px){.bulk{transform:none}}
@media (forced-colors:active){.pill,.chip.on,.sw span{border:1px solid CanvasText}}
</style>

function fuzzy(q,s){ // subsequence match with bonuses; returns {score,idx}
 if(!q)return {score:0,idx:[]};
 var t=s.toLowerCase(),j=0,score=0,idx=[],prev=-2;
 for(var i=0;i<t.length&&j<q.length;i++){if(t[i]===q[j]){idx.push(i);score+=(i===prev+1?6:1)+(i===0||/[\s\-·]/.test(t[i-1])?5:0);prev=i;j++}}
 if(j<q.length)return null;
 var sub=t.indexOf(q);if(sub<0&&idx[idx.length-1]-idx[0]>q.length*3+3)return null;if(sub>=0)score+=20-Math.min(sub,15);
 return {score:score-t.length*.02,idx:idx};
}
function hl(s,idx){if(!idx.length)return esc(s);var o='',set={};idx.forEach(function(i){set[i]=1});for(var i=0;i<s.length;i++)o+=set[i]?'<mark>'+esc(s[i])+'</mark>':esc(s[i]);return o}
function openPalette(){
 if(pal){$('input',pal.el).focus();return}
 closeMenu(true);
 var sc=scrim(function(){close()}),el=D.createElement('div');el.className='over modal palette';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Opdrachtenpalet');
 el.innerHTML='<div class="pin">'+ic('search')+'<input type="text" role="combobox" aria-expanded="true" aria-controls="plist" aria-autocomplete="list" placeholder="Zoek pagina’s, klanten, werkorders of acties…" aria-label="Zoeken" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div><div class="plist" id="plist" role="listbox" aria-label="Resultaten"></div><div class="pfoot"><span><kbd>↑</kbd><kbd>↓</kbd> kiezen</span><span><kbd>↵</kbd> openen</span><span><kbd>Esc</kbd> sluiten</span></div>';
 D.body.appendChild(el);
 var inp=$('input',el),list=$('#plist',el),all=commands(),res=[],hi=0;
 function draw(){
  var q=inp.value.trim().toLowerCase();
  if(!q){res=all.filter(function(c){return c.g!=='Klanten'&&c.g!=='Werkorders'&&c.g!=='Weergaven'}).map(function(c){return {c:c,idx:[]}}).concat(all.filter(function(c){return c.g==='Werkorders'}).slice(0,4).map(function(c){return {c:c,idx:[]}}))}
  else{res=[];all.forEach(function(c){var m=fuzzy(q,c.l)||(c.sub&&fuzzy(q,c.sub)&&{score:fuzzy(q,c.sub).score-8,idx:[]});if(m)res.push({c:c,idx:m.idx,s:m.score})});res.sort(function(a,b){return b.s-a.s});res=res.slice(0,30);
   var order=[];res.forEach(function(r){if(order.indexOf(r.c.g)<0)order.push(r.c.g)});res.sort(function(a,b){return order.indexOf(a.c.g)-order.indexOf(b.c.g)})}
  hi=Math.min(hi,Math.max(0,res.length-1));
  if(!res.length){list.innerHTML='<div class="pnone">Niets gevonden voor “'+esc(inp.value)+'”.</div>';inp.removeAttribute('aria-activedescendant');return}
  var h='',g='';res.forEach(function(r,i){if(r.c.g!==g){g=r.c.g;h+='<div class="pgrp" role="presentation">'+esc(g)+'</div>'}h+='<div class="popt" role="option" id="po'+i+'" data-i="'+i+'" aria-selected="'+(i===hi)+'">'+ic(r.c.i)+'<span class="t">'+hl(r.c.l,r.idx)+'</span>'+(r.c.sub?'<span class="sub">'+esc(r.c.sub)+'</span>':'')+(r.c.k?'<span class="end">'+r.c.k.map(function(k){return '<kbd>'+k+'</kbd>'}).join('')+'</span>':'')+'</div>'});
  list.innerHTML=h;inp.setAttribute('aria-activedescendant','po'+hi);
 }
 function move(i){if(!res.length)return;hi=(i+res.length)%res.length;$$('.popt',list).forEach(function(o){o.setAttribute('aria-selected',+o.dataset.i===hi)});inp.setAttribute('aria-activedescendant','po'+hi);var o=$('#po'+hi,list);o&&o.scrollIntoView({block:'nearest'})}
 function run(i){var r=res[i];if(!r)return;close();r.c.run()}
 function close(){if(!pal)return;pal=null;popLayer(el);el.remove();killScrim(sc)}
 inp.addEventListener('input',function(){hi=0;draw()});
 inp.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||(e.ctrlKey&&e.key==='n')){e.preventDefault();move(hi+1)}
  else if(e.key==='ArrowUp'||(e.ctrlKey&&e.key==='p')){e.preventDefault();move(hi-1)}
  else if(e.key==='Enter'){e.preventDefault();run(hi)}
 });
 list.addEventListener('mousemove',function(e){var o=e.target.closest('.popt');if(o&&+o.dataset.i!==hi)move(+o.dataset.i)});
 list.addEventListener('click',function(e){var o=e.target.closest('.popt');if(o)run(+o.dataset.i)});
 pal={el:el};pushLayer(el,close);draw();inp.focus();
}
$('#searchBtn').onclick=openPalette;

/* ---------- shortcuts sheet ---------- */
function showKeys(){
 if($('.keys'))return;
 var mod=isMac?'⌘':'Ctrl',r=function(l,ks){return '<div><span>'+l+'</span><span>'+ks.map(function(k){return '<kbd>'+k+'</kbd>'}).join('')+'</span></div>'};
 modal('Sneltoetsen','<div class="keys"><h3>Algemeen</h3>'+r('Opdrachtenpalet',[mod,'K'])+r('Deze lijst',['?'])+r('Filter zoeken',['/'])+r('Nieuwe werkorder',['n'])+r('Zijbalk',['['])+r('Sluiten',['Esc'])+
 '<h3>Werkorders</h3>'+r('Volgende regel',['j'])+r('Vorige regel',['k'])+r('Openen',['↵'])+r('Status wijzigen',['e'])+r('Selecteren',['x'])+r('Alles op pagina',['Shift','A'])+r('Volgende pagina',['→'])+r('Vorige pagina',['←'])+
 '<h3>Ga naar</h3>'+r('Werkorders',['g','w'])+r('Planning',['g','p'])+r('Klanten',['g','k'])+r('Team en rechten',['g','t'])+'</div><p style="margin:14px 0 0;color:var(--muted);font-size:12.5px">Sneltoetsen werken niet terwijl u in een veld typt.</p>',null,null,true);
}
$('#keysBtn').onclick=showKeys;

/* ---------- theme / sidebar / drawer ---------- */
var isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
$('#modKey').textContent=isMac?'⌘K':'Ctrl K';$('#searchBtn').setAttribute('aria-label','Zoeken of opdracht uitvoeren ('+(isMac?'⌘':'Ctrl+')+'K)');
function toggleTheme(){
 S.theme=S.theme==='dark'?'light':'dark';D.documentElement.setAttribute('data-theme',S.theme);store('vonkel-theme',S.theme);
 var b=$('#themeBtn');b.innerHTML=ic(S.theme==='dark'?'sun':'moon');b.setAttribute('aria-label',S.theme==='dark'?'Licht thema':'Donker thema');
}
$('#themeBtn').onclick=toggleTheme;
if(store('vonkel-theme')==='dark')toggleTheme();
function toggleSide(){
 if(innerWidth<=760){openDrawer();return}
 var a=$('#app'),c=a.classList.toggle('collapsed');var b=$('#collapseBtn');b.setAttribute('aria-expanded',!c);b.setAttribute('aria-label',c?'Zijbalk uitklappen':'Zijbalk inklappen');
}
$('#collapseBtn').onclick=toggleSide;
var drawerScrim=null;
function openDrawer(){var s=$('#side');if(s.classList.contains('open'))return;s.classList.add('open');$('#menuBtn').setAttribute('aria-expanded','true');drawerScrim=scrim(closeDrawer);pushLayer(s,closeDrawer,$('#menuBtn'));var a=$('#nav a[aria-current]');(a||$('#nav a')).focus()}
function closeDrawer(){var s=$('#side');if(!s.classList.contains('open'))return;s.classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');killScrim(drawerScrim);drawerScrim=null;popLayer(s)}
$('#menuBtn').onclick=openDrawer;
addEventListener('resize',function(){if(innerWidth>760)closeDrawer();else $('#app').classList.remove('collapsed')});

/* ---------- global shortcuts ---------- */
var gPending=0;
function typing(t){return t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))}
D.addEventListener('keydown',function(e){
 if((e.metaKey||e.ctrlKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){e.preventDefault();if(pal){var L=topLayer();L&&L.close()}else openPalette();return}
 if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey)return;
 if(typing(e.target))return;
 var L=topLayer(),inSheet=L&&sheetEl&&L.el===sheetEl;
 if(L&&!inSheet)return; // a modal/menu/palette owns the keyboard
 var k=e.key;
 if(k==='?'){e.preventDefault();showKeys();return}
 if(inSheet){
  if(k==='j'){e.preventDefault();stepSheet(1)}else if(k==='k'){e.preventDefault();stepSheet(-1)}
  else if(k==='e'&&$('#shSt',sheetEl)){e.preventDefault();var o=OB[S.detail];menu($('#shSt'),{title:'Status',keyboard:true,items:statusItems(o.st),onPick:function(v){if(v!==o.st)setStatus([o.id],v)}})}
  return;
 }
 if(gPending){gPending=0;var map={w:'orders',p:'planning',k:'customers',t:'team',l:'log'};if(map[k]){e.preventDefault();go(map[k])}return}
 if(k==='g'){gPending=1;setTimeout(function(){gPending=0},900);return}
 if(k==='['){e.preventDefault();toggleSide();return}
 if(k==='n'&&can('assign')){e.preventDefault();if(S.page!=='orders')go('orders',true);newOrder();return}
 if(S.page!=='orders')return;
 var rows=pageRows();
 if(k==='/'){e.preventDefault();var q=$('#q');q&&q.focus();return}
 if(k==='j'||k==='ArrowDown'&&e.target.closest&&e.target.closest('#tb')){e.preventDefault();if(!rows.length)return;S.act=Math.min(rows.length-1,S.act+1);markActive();focusAct();return}
 if(k==='k'||k==='ArrowUp'&&e.target.closest&&e.target.closest('#tb')){e.preventDefault();if(!rows.length)return;S.act=Math.max(0,S.act<0?0:S.act-1);markActive();focusAct();return}
 if(k==='ArrowRight'&&!e.target.closest('#views')){var n=$('[data-pg="1"]');if(n&&!n.disabled){e.preventDefault();n.click()}return}
 if(k==='ArrowLeft'&&!e.target.closest('#views')){var p=$('[data-pg="-1"]');if(p&&!p.disabled){e.preventDefault();p.click()}return}
 if(k==='A'&&e.shiftKey){e.preventDefault();var allOn=rows.every(function(o){return S.sel[o.id]});rows.forEach(function(o){if(allOn)delete S.sel[o.id];else S.sel[o.id]=1});renderOrdersBody();return}
 if(k==='Escape'&&selIds().length){S.sel={};renderOrdersBody();say('Selectie opgeheven');return}
 var cur=rows[S.act];if(!cur)return;
 if(k==='Enter'||k==='o'){if(e.target.closest&&e.target.closest('button,a,input,label'))return;e.preventDefault();openSheet(cur.id)}
 else if(k==='x'){e.preventDefault();if(S.sel[cur.id])delete S.sel[cur.id];else S.sel[cur.id]=1;renderOrdersBody();focusAct();say((S.sel[cur.id]?'Geselecteerd: ':'Niet meer geselecteerd: ')+'WO-'+cur.id)}
 else if(k==='e'){e.preventDefault();var pill=$('#tb tr.is-act [data-st]');if(pill)statusMenu(pill,cur.id,true)}
});
function focusAct(){var r=$('#tb tr.is-act');if(r)r.focus({preventScroll:false})}

/* ---------- boot ---------- */
function bh(){D.documentElement.style.setProperty('--bh',$('.demo-banner').offsetHeight+'px')}bh();addEventListener('resize',bh);
var qs=location.search;
if(/[?&]state=select/.test(qs)){S.view='open'}
renderNav();render();
if(/[?&]state=select/.test(qs)){var r=pageRows();[1,2,4].forEach(function(i){if(r[i])S.sel[r[i].id]=1});S.act=4;renderOrdersBody()}
if(/[?&]state=detail/.test(qs)){var r2=pageRows();S.sel[r2[2].id]=1;S.sel[r2[3].id]=1;S.act=1;renderOrdersBody();openSheet(r2[1].id);D.activeElement.blur()}
if(/[?&]theme=dark/.test(qs)&&S.theme!=='dark')toggleTheme();
})();
</script>
